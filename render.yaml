services:
  - type: web
    name: ricehub-backend
    env: python
    healthCheckPath: /health/
    buildCommand: "pip install -r backend/requirements.txt && python backend/manage.py check --deploy --tag security && python backend/manage.py collectstatic --noinput"
    startCommand: "cd backend && daphne -b 0.0.0.0 -p ${PORT:-10000} config.asgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DB_USER
        value: admin
      - key: DB_PASSWORD
        sync: false
      - key: DB_SERVICE_NAME
        sync: false
      - key: WALLET_DIR
        value: /etc/secrets
      - key: REDIS_URL
        sync: false
      - key: OCI_OBJECT_STORAGE_NAMESPACE
        sync: false
      - key: OCI_OBJECT_STORAGE_BUCKET
        sync: false
      - key: OCI_OBJECT_STORAGE_REGION
        sync: false
      - key: OCI_OBJECT_STORAGE_ACCESS_KEY
        sync: false
      - key: OCI_OBJECT_STORAGE_SECRET_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://ricehub-frontend.onrender.com
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        sync:false
      - key: SADAPAY_ACCOUNT_NAME
        sync:false
      - key: SADAPAY_ACCOUNT_NUMBER
        sync:false
      - key: SECURITY_EVENT_RETENTION_DAYS
        value: "90"
  - type: worker
    name: ricehub-celery-worker
    env: docker
    dockerfilePath: ./backend/Dockerfile.worker
    dockerContext: .
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DB_USER
        sync:false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SERVICE_NAME
        sync: false
      - key: WALLET_DIR
        value: /etc/secrets
      - key: REDIS_URL
        sync: false
      - key: OCI_OBJECT_STORAGE_NAMESPACE
        sync: false
      - key: OCI_OBJECT_STORAGE_BUCKET
        sync: false
      - key: OCI_OBJECT_STORAGE_REGION
        sync: false
      - key: OCI_OBJECT_STORAGE_ACCESS_KEY
        sync: false
      - key: OCI_OBJECT_STORAGE_SECRET_KEY
        sync: false
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
  - type: static
    name: ricehub-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://ricehub-umfd.onrender.com/api
      - key: VITE_WS_URL
        value: wss://ricehub-umfd.onrender.com/ws
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
