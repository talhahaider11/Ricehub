services:

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: whitefiber
      POSTGRES_USER: whitefiber
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data


  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data


  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
    volumes:
      - backend_static:/app/staticfiles
      - backend_media:/app/media


  frontend:
    build:
      context: ./frontend
    restart: unless-stopped


  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - backend_static:/static:ro
      - backend_media:/media:ro

volumes:
  postgres_data:
  redis_data:
  backend_static:
  backend_media: