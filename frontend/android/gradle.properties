# Project-wide Gradle settings

# Memory Optimization (Render free tier / CI servers ke liye 2048m ya 1536m safe hai)
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Parallel building for faster builds
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX Support
android.useAndroidX=true
android.enableJetifier=true

# Configure release signing values in the user-level Gradle properties file,
# not in this project file. See ../../RELEASE_SIGNING.md.